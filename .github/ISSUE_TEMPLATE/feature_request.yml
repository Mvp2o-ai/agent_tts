name: Feature request
description: Propose a product or contributor-experience improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: checkboxes
    attributes:
      label: Before filing
      options:
        - label: I searched existing issues for this request.
          required: true
        - label: This fits the mobile-only, provider-neutral product contract.
          required: true
  - type: textarea
    attributes:
      label: Problem
      description: Describe the user problem, not only the proposed implementation.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Proposed outcome
    validations:
      required: true
  - type: textarea
    attributes:
      label: Alternatives and tradeoffs
