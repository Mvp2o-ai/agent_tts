name: agentbox image

on:
  push:
    branches: [main]
    paths: ["agentbox/**"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: agentbox
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/agentbox:latest
            ghcr.io/${{ github.repository }}/agentbox:${{ github.sha }}
