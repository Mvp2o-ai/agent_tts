name: CI

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:
    inputs:
      publish_image:
        description: Publish the runtime image after checks pass
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  runtime:
    name: Runtime (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  mobile:
    name: Mobile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run config:check

  android:
    name: Android native
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - run: npm ci
      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install
      - name: Compile and run Android unit tests
        working-directory: mobile/android
        run: >-
          ./gradlew
          :app:assembleDebug
          :voice-audio:testDebugUnitTest
          --no-daemon

  changes:
    name: Change scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      image: ${{ steps.filter.outputs.image }}
      runtime: ${{ steps.filter.outputs.runtime }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: filter
        name: Detect runtime image changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
          MANUAL_PUBLISH: ${{ inputs.publish_image || false }}
        run: |
          image=false
          runtime=false
          if [[ "$MANUAL_PUBLISH" == "true" || "$REF" == refs/tags/v* ]]; then
            image=true
          elif [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- \
              agentbox gateway package.json package-lock.json \
              .dockerignore .github/workflows/ci.yml || image=true
            git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- \
              agentbox gateway package.json package-lock.json \
              .dockerignore || runtime=true
          elif [[ -n "$BEFORE_SHA" &&
                  "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            git diff --quiet "$BEFORE_SHA" "$PUSH_SHA" -- \
              agentbox gateway package.json package-lock.json \
              .dockerignore .github/workflows/ci.yml || image=true
            git diff --quiet "$BEFORE_SHA" "$PUSH_SHA" -- \
              agentbox gateway package.json package-lock.json \
              .dockerignore || runtime=true
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "runtime=$runtime" >> "$GITHUB_OUTPUT"

  runtime_lock:
    name: Runtime release contract
    needs: changes
    if: always() && needs.changes.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Enforce runtime image lock state
        env:
          RUNTIME_CHANGED: ${{ needs.changes.outputs.runtime }}
          MANUAL_PUBLISH: ${{ inputs.publish_image || false }}
        run: |
          if [[ "$RUNTIME_CHANGED" == "true" ]]; then
            node scripts/runtime-image-lock.mjs require-pending
          elif [[ "$MANUAL_PUBLISH" == "true" ]]; then
            node scripts/runtime-image-lock.mjs require-pending ||
              node scripts/runtime-image-lock.mjs check
          else
            node scripts/runtime-image-lock.mjs check
          fi

  image:
    name: Runtime image
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.image == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: gateway/Dockerfile
          push: false
          load: true
          tags: agent_tts:ci
          cache-from: type=gha
      - name: Smoke-test the built image
        run: |
          set -euo pipefail
          container=agent-tts-ci
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          docker run -d --name "$container" \
            -e GATEWAY_TOKEN=ci-gateway-token-not-a-secret \
            -e CONFIG_DB=memory \
            -e "AGENTBOX_COMMAND=node /app/gateway/dist/testing/fake-box.js" \
            -p 127.0.0.1:4100:4100 \
            agent_tts:ci
          for _ in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4100/health >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4100/health >/dev/null
          pid1_user=$(docker top "$container" -eo user,pid,ppid,comm |
            awk 'NR == 2 { print $1 }')
          [[ "$pid1_user" != "root" && "$pid1_user" != "0" ]]
          response=$(curl --fail --silent \
            -H "Authorization: Bearer ci-gateway-token-not-a-secret" \
            -H "Content-Type: application/json" \
            -d '{"text":"image smoke test"}' \
            http://127.0.0.1:4100/v1/debug/prompt)
          [[ "$response" == *'"type":"done"'* ]]

  ci:
    name: All checks
    if: always()
    needs: [runtime, mobile, android, changes, runtime_lock, image]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all applicable checks
        env:
          RUNTIME_RESULT: ${{ needs.runtime.result }}
          MOBILE_RESULT: ${{ needs.mobile.result }}
          ANDROID_RESULT: ${{ needs.android.result }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          RUNTIME_LOCK_RESULT: ${{ needs.runtime_lock.result }}
          IMAGE_RESULT: ${{ needs.image.result }}
        run: |
          set -euo pipefail
          test "$RUNTIME_RESULT" = "success"
          test "$MOBILE_RESULT" = "success"
          test "$ANDROID_RESULT" = "success"
          test "$CHANGES_RESULT" = "success"
          test "$RUNTIME_LOCK_RESULT" = "success"
          [[ "$IMAGE_RESULT" == "success" || "$IMAGE_RESULT" == "skipped" ]]

  publish:
    name: Publish runtime image
    needs: [runtime, changes, runtime_lock]
    if: >-
      always() &&
      needs.runtime.result == 'success' &&
      needs.changes.result == 'success' &&
      needs.runtime_lock.result == 'success' &&
      ((github.event_name == 'push' &&
        needs.changes.outputs.image == 'true') ||
       (github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/main' &&
        inputs.publish_image))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Normalize image name
        id: image-name
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: metadata
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ steps.image-name.outputs.name }}
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
      - id: publish-image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: gateway/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
      - name: Record immutable image digest
        env:
          IMAGE_NAME: ${{ steps.image-name.outputs.name }}
          IMAGE_DIGEST: ${{ steps.publish-image.outputs.digest }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          echo "### Runtime image" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$IMAGE_NAME@$IMAGE_DIGEST\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Pin this exact runtime before any mobile build:" >> "$GITHUB_STEP_SUMMARY"
          echo "\`node scripts/runtime-image-lock.mjs mark-ready '$IMAGE_NAME@$IMAGE_DIGEST' '$SOURCE_COMMIT'\`" >> "$GITHUB_STEP_SUMMARY"
