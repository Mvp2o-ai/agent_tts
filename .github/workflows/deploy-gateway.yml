name: deploy gateway

# This project does not host the gateway. Operators deploy it on their own
# machine (anything that can spawn Docker containers). The workflow only
# builds so the artifact stays green on main.

on:
  push:
    branches: [main]
    paths: ["gateway/**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run build --workspace=@agent_tts/gateway
      - name: Deploy
        run: echo "no first-party deploy — operators ship this binary to their own host"
