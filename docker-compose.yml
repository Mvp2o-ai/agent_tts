# One service = one agent. Deploy this compose file once per agent identity.
# `restart: always` is load-bearing: session reset exits the process and the
# recreated/restarted container must come back automatically. For a truly
# fresh filesystem on reset, managed hosts recreate from the image; on raw
# Docker run `docker compose up -d --force-recreate` or use a supervisor
# around `docker run --rm`.
services:
  agent:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    restart: always
    ports:
      # Host loopback only. Inside the container the process still binds
      # 0.0.0.0 so this publish works. iOS Simulator: http://127.0.0.1:4100.
      # A physical phone should use Tailscale Serve, not a LAN publish.
      - "127.0.0.1:4100:4100"
    env_file:
      - .env
    volumes:
      - agent_tts_data:/data

volumes:
  agent_tts_data:
